name: Stale

# The cheapest volume reducer for a solo maintainer, and the least rude one available: it
# says out loud that a thread has gone quiet instead of leaving people to guess whether
# anyone is reading.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

# Nothing at the workflow level: the one job declares what the stale action needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stale:
    name: Mark quiet threads stale
    runs-on: ubuntu-latest
    # The action labels and closes issues and pull requests; it reads no code.
    permissions:
      issues: write # label and close stale issues
      pull-requests: write # label and close stale pull requests
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 21

          stale-issue-message: >
            No activity here for 60 days, so this is being marked stale. That is a statement
            about the thread, not about whether the issue is valid — comment to keep it open,
            and it will not be closed automatically while there is discussion. If it is closed
            and still matters to you, say so and it gets reopened.

          stale-pr-message: >
            No activity here for 45 days, so this is being marked stale. If it is waiting on
            review rather than on you, say so and it stays open — a maintainer's queue is not
            a contributor's problem.

          close-issue-message: >
            Closing after 14 days with no further activity. Not a judgement on the idea; reopen
            or comment any time and it comes back.

          close-pr-message: >
            Closing after 21 days with no further activity. The branch is untouched — reopen
            when you want to pick it up.

          exempt-issue-labels: "good first issue,help wanted,security,pinned,roadmap"
          exempt-pr-labels: "security,pinned,dependencies"

          exempt-all-assignees: true

          remove-stale-when-updated: true

          operations-per-run: 60
