name: Release
# Publishing is one act: the maintainer creates a GitHub Release from a `v*` tag, with the
# release notes. That event builds the wheel and sdist, publishes them to PyPI through trusted
# publishing, signs them with Sigstore, and attaches the artifacts and their signature bundles
# to the same Release, so what is on PyPI and what is on GitHub are the same bytes, and anyone
# can verify who built them.
on:
  release:
    types: [published]
# Nothing at the workflow level: build reads, publish holds the one OIDC permission.
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build the wheel and sdist
    runs-on: ubuntu-latest
    # Reads the tagged checkout; writes nothing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r requirements/build.txt
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/context-report/
    permissions:
      # No secrets: PyPI trusted publishing exchanges this token for a short-lived
      # upload credential (see https://docs.pypi.org/trusted-publishers/).
      id-token: write # exchanged for a short-lived PyPI upload credential
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  sign:
    name: Sign the artifacts and attach them to the Release
    needs: publish
    runs-on: ubuntu-latest
    # id-token for the Sigstore keyless signature; contents to upload the artifacts and
    # their signature bundles to the Release that triggered this run.
    permissions:
      id-token: write # Sigstore keyless signing identity
      contents: write # attach dist/* and the .sigstore.json bundles to the Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          release-signing-artifacts: true
