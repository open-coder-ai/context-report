name: CI
on:
  push:
    branches: [main]
  pull_request:
# Nothing at the workflow level: each job below declares the least it needs.
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Every PR commit must carry a Signed-off-by trailer (Developer Certificate of
  # Origin -- see CONTRIBUTING.md). Same in-workflow check chock and chock-catalog run.
  dco:
    name: DCO sign-off on every commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Reads the PR's commits; writes nothing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Signed-off-by on every PR commit
        env:
          # The base commit, not the branch name: fetch-depth 0 already has it, and a
          # fetch here would need credentials the checkout deliberately did not keep
          # (persist-credentials: false), which fails on a private repository.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+<.\+@.\+>'; then
              echo "::error::commit $sha lacks a Signed-off-by trailer (git commit -s)"
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..HEAD")
          exit "$missing"

  # Commit messages and PR bodies are as public as the diff and much easier to leak
  # into -- container paths, session identifiers, personal addresses. Checked here
  # because the local test can only see the history it has.
  no-private-data:
    name: Scan commit messages for local or personal data
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Reads the PR's commits; writes nothing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan commit messages for local or personal data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          local_data='/home/[A-Za-z0-9._-]+/|/Users/[A-Za-z0-9._-]+/|session_[0-9A-Za-z]{12,}|claude\.ai/code/session|/tmp/claude-[0-9]'
          email='[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,24}'
          # Suffixes that make a match a file path rather than an address.
          not_mail='\.(json|ya?ml|md|txt|py|js|ts|tsx|sh|toml|cfg|ini|lock|log|csv|tsv|html?|svg|png|jpe?g|gif|pdf|zip|gz|tar|whl|so|dll|exe)$'
          # Addresses that identify a service rather than a person.
          service='@users\.noreply\.github\.com$|^noreply@anthropic\.com$|^support@github\.com$|^noreply@github\.com$'
          # The maintainer's personal address, as a SHA-256 digest: writing it here in the
          # clear would publish it more prominently than the commits this check guards.
          blocked_digest='ecda4887099c1a8d73af02994c42938dfb0a1857674f6c3a6403af922360104f'
          found=0
          while read -r sha; do
            msg=$(git log -1 --format=%B "$sha")
            # Name the commit, never echo the match: a log line is a publication too.
            if printf '%s' "$msg" | grep -qiE "$local_data"; then
              echo "::error::commit $sha contains a local path or session identifier"
              found=1
            fi
            # A sign-off is somebody's own attestation, so a contributor's address there is
            # their choice and stays allowed. Anywhere else an address arrived by accident --
            # pasted from a log, a stack trace, or a quoted report.
            body=$(printf '%s' "$msg" | grep -viE '^(Signed-off-by|Co-Authored-By|Reported-by|Reviewed-by|Tested-by|Acked-by):')
            if printf '%s' "$body" | grep -oiE "$email" | grep -ivE "$not_mail" | grep -qivE "$service"; then
              echo "::error::commit $sha contains an email address outside a sign-off trailer"
              found=1
            fi
            while read -r addr; do
              [ -n "$addr" ] || continue
              if [ "$(printf '%s' "$addr" | tr '[:upper:]' '[:lower:]' | sha256sum | cut -d' ' -f1)" = "$blocked_digest" ]; then
                echo "::error::commit $sha contains the maintainer's personal address; sign off with the GitHub noreply address"
                found=1
              fi
            done <<< "$(printf '%s' "$msg" | grep -oiE "$email")"
          done < <(git rev-list --no-merges "$BASE_SHA..HEAD")
          exit "$found"

  check:
    name: Lint and test
    runs-on: ubuntu-latest
    # Reads the checkout; writes nothing.
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python }}
      # Every third-party package is hash-pinned in requirements/ci.txt; the package
      # itself is installed on top with no dependency resolution of its own.
      - run: pip install --require-hashes -r requirements/ci.txt
      - run: pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q

  # This repo is itself a chock adopter (see AGENTS.md, .agents/policies/): it governs
  # its own contributions the same way chock and chock-catalog do. Checking it here
  # proves the adoption on this repo rather than only in chock's own tests, and closes
  # the gap `git commit --no-verify` and an un-synced clone would otherwise leave open
  # (see SECURITY.md).
  policies:
    name: chock adoption is valid
    runs-on: ubuntu-latest
    # Reads this checkout and the pinned framework checkout; writes nothing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      # The framework pin lives in the .framework-ref data file, same as chock-catalog,
      # so an adoption PR (bumping the pin) never has to touch this workflow.
      - name: Read the framework pin
        run: echo "FRAMEWORK_REF=$(cat .framework-ref)" >> "$GITHUB_ENV"
      - name: Check out the framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          repository: open-coder-ai/chock
          ref: ${{ env.FRAMEWORK_REF }}
          path: .framework
      - name: Install chock
        # chock's own dependencies are hash-pinned in requirements/chock.txt (its pyproject at
        # the pinned tag); chock itself then installs from the pinned checkout with no resolution.
        run: |
          pip install --require-hashes -r requirements/chock.txt
          pip install --no-deps ./.framework
      - name: This repo is a valid adopter
        run: |
          chock check
          chock sync --repo . --check

  # A stale generated figure fails the build: regenerate every docs/figures/*.svg and diff against
  # what is committed. make_row_basis.py and make_social_card.py both shell out to the README's
  # own quickstart block (see tools/quickstart_block.py) to draw their numbers from a real,
  # freshly produced report.json, so context-report itself must be installed first.
  figures:
    name: Generated figures are not stale
    runs-on: ubuntu-latest
    # Reads the checkout; writes nothing (the regenerated files are diffed, never pushed).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/ci.txt
      - run: pip install --no-deps -e .
      - name: Regenerate figures
        run: cd docs/figures && for g in make_*.py; do python "$g"; done
      - name: Fail on drift
        run: git diff --exit-code -- docs/figures
