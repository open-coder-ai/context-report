name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
# Nothing at the workflow level: the deploy job alone holds the Pages permissions.
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    name: Render and deploy the spec
    runs-on: ubuntu-latest
    # contents to read the spec, pages and id-token to publish the artifact to GitHub Pages.
    permissions:
      contents: read
      pages: write # deploy the artifact to GitHub Pages
      id-token: write # the OIDC token the Pages deploy action exchanges
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/pages.txt
      # Pages serves the artifact as static files: an index.md is never rendered, so the root was
      # a 404. Render every Markdown file to HTML beside it and publish the rendered tree.
      - run: python .github/scripts/render_pages.py spec _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
