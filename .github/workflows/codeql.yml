name: CodeQL

# Static analysis of the repo's own Python. A project that reports on whether other
# artifacts actually work should be able to say what it runs against itself.
#
# CodeQL needs the repository to be public, or GitHub Advanced Security on a private one.
# The job below is guarded on `private == false` rather than left to fail, because a
# workflow that is red on every push teaches everyone to ignore red workflows -- which is
# the same failure mode as a guard that cannot be satisfied. It starts working by itself
# the day the repo flips.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, off-hours on a Monday. The value of a scheduled run is catching advisories
    # published after the last commit, which is a weekly-scale event, not a per-push one.
    - cron: "17 4 * * 1"

# Nothing at the workflow level: the one job declares what CodeQL needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    # contents to read the source, security-events to upload the SARIF, actions to read
    # the run's own metadata, which the CodeQL action requires.
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
      actions: read # the CodeQL action reads its own run metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: python
          # security-and-quality over the default: the default suite is tuned to keep
          # noise low on large codebases. This one is small, solo-reviewed, and its whole
          # claim is carefulness, so the broader suite is affordable and appropriate.
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: "/language:python"
