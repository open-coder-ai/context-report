# OSSF Scorecard: supply-chain posture score + public badge.
#
# Gated on the public repository name so it no-ops anywhere else and starts scoring on
# the first scheduled run once `open-coder-ai/context-report` is public. publish_results
# feeds the REST API behind the README badge and requires a public repo -- another reason
# for the gate.
name: Scorecard

on:
  schedule:
    - cron: "30 4 * * 1" # weekly, Monday 04:30 UTC
  push:
    branches: [main]
  workflow_dispatch:

# Nothing at the workflow level: the one job declares what Scorecard needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'open-coder-ai/context-report'
    runs-on: ubuntu-latest
    # contents to read the repository, security-events to upload the SARIF,
    # id-token to publish the score (OIDC).
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the score to the Scorecard API (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: results.sarif
