name: "context-report CodeQL config"

# The one carve-out: .chock/bin/ holds the runner scripts chock renders for each agent at
# adoption time. They are generated from chock's own templates, reviewed and scanned in
# chock's repository, and regenerated by `chock sync`; findings on them are findings on
# chock, not on this project, so they are excluded here rather than patched here.
paths-ignore:
  - .chock/bin
